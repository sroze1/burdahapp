workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Generate certificate private key
        script: |
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout $HOME/certificate_key.pem \
            -out /dev/null -subj "/CN=BurdahApp"
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "com.burdahapp.burdahapp" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=$HOME/certificate_key.pem
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up Xcode project settings
        script: |
          xcode-project use-profiles
      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0) + 1))
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
