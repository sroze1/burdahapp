workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          # Revoke any existing distribution certificates
          app-store-connect certificates list --type DISTRIBUTION --json | \
            python3 -c "import sys,json;certs=json.load(sys.stdin);[print(c['id']) for c in certs]" 2>/dev/null | \
            while read -r cert_id; do
              echo "Revoking $cert_id"
              app-store-connect certificates revoke "$cert_id" || true
            done
          # Generate fresh RSA key and create certificate
          openssl genrsa 2048 2>/dev/null > /tmp/cert_key.pem
          export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"
          app-store-connect fetch-signing-files "com.burdahapp.burdahapp" \
            --type IOS_APP_STORE \
            --create
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up Xcode project settings
        script: |
          xcode-project use-profiles
      - name: Flutter build IPA
        script: |
          FLUTTER_BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//;s/+.*//')
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist \
            --build-name=$FLUTTER_BUILD_NAME \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0) + 1))
      - name: Upload to App Store Connect
        script: |
          xcrun altool --upload-app \
            --file build/ios/ipa/burdahapp.ipa \
            --type ios \
            --apple-id "$APP_STORE_APP_ID" \
            --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - build/ios/ipa/*.ipa
