# Native pre-engine splash configuration (SPLSH-04, D-07).
#
# Color-only by design — matches SplashScreen's Colors.black background
# (lib/screens/splash_screen.dart) so the pre-engine native splash hands
# off to the animated Flutter splash with no visible white flash and no
# visible seam. The Madinah photo and Bismillah text animation belong to
# the Flutter widget, not this native layer (see 04-RESEARCH.md
# Anti-Patterns — native splash images must be square and would crop a
# 16:9 photo awkwardly).
flutter_native_splash:
  color: "#000000"
  color_dark: "#000000"

  android_12:
    color: "#000000"
    color_dark: "#000000"

  fullscreen: true
